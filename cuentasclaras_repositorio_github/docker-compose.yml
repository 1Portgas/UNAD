version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: cuentasclaras_db
    environment:
      POSTGRES_DB: cuentasclaras_prod
      POSTGRES_USER: admin_cuentas
      POSTGRES_PASSWORD: SecretPasswordUNAD2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cartera:/var/lib/postgresql/data
      - ./database/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - red_cuentasclaras
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_cuentas -d cuentasclaras_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuentasclaras_backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/cuentasclaras_prod
      SPRING_DATASOURCE_USERNAME: admin_cuentas
      SPRING_DATASOURCE_PASSWORD: SecretPasswordUNAD2026!
      JWT_SECRET: cXVpbnRvX3Byb3llY3RvX2dyYWRvX3VuYWRfc3lzdGVtXzIwMjZfc2VjdXJlX2tleQ==
      JWT_EXPIRATION_HOURS: 8
    networks:
      - red_cuentasclaras

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cuentasclaras_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - red_cuentasclaras

volumes:
  pgdata_cartera:

networks:
  red_cuentasclaras:
    driver: bridge
